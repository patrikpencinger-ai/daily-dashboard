html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:20px;transition:background .2s}
#wrap{--bg:#ffffff;--surf:#f1efe8;--tp:#1a1a18;--ts:rgba(0,0,0,0.62);--bd:rgba(0,0,0,0.28);

 background:var(--bg);color:var(--tp);padding:16px;border-radius:12px;width:100%;max-width:900px;margin:0 auto;box-sizing:border-box}
#wrap.dark{--bg:#262624;--surf:#33322f;--tp:#ffffff;--ts:rgba(255,255,255,0.72);--bd:rgba(255,255,255,0.22);
 --amber:#D99A2B;--red:#E24B4A;--warnbg:rgba(217,154,43,0.14)}
#wrap.mobile{padding:14px}
#wrap.big{zoom:1.5;width:calc(100%/1.5);max-width:600px}
.card{background:var(--surf);border-radius:8px;padding:0.85rem 1rem}
.lab{font-size:13px;color:var(--ts)}
.sub{font-size:12px;color:var(--ts)}
.mini{font-size:10px;font-weight:400;color:var(--ts)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0 0 1.25rem}
#wrap.mobile .cards{grid-template-columns:1fr 1fr;gap:10px}
.h{font-size:16px;font-weight:500;letter-spacing:0.08em;margin:0 0 0.75rem}
.bars{display:flex;flex-direction:column;gap:13px;margin:0 0 1.5rem}
.brow .bl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ts);margin-bottom:5px}
.brow .bl b{color:var(--tp);font-weight:500;text-align:right}
.track{background:var(--surf);height:9px;border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px;transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 1.5rem}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ts);text-align:right;padding:0 8px 8px;font-weight:500}
th:first-child{text-align:left;padding-left:4px}
td{padding:8px;text-align:right;font-variant-numeric:tabular-nums;border-top:0.5px solid var(--bd)}
td:first-child{text-align:left;color:var(--ts);padding-left:4px}
tfoot td{font-weight:600;border-top:1px solid var(--bd)}
#wrap.mobile #daysum table,#wrap.mobile #weeksum table{font-size:11px}
#wrap.mobile #daysum th,#wrap.mobile #daysum td,#wrap.mobile #weeksum th,#wrap.mobile #weeksum td{padding:5px 4px}
.note{background:var(--bg);border:0.5px solid var(--bd);border-radius:12px;padding:1rem 1.25rem;margin-bottom:0.25rem;line-height:1.6}
.state{text-align:center;padding:60px 20px;color:var(--ts);font-size:13px}
.chip{display:inline-block;font-size:11px;line-height:1.35;padding:3px 9px;border-radius:999px;border:0.5px solid currentColor;margin:3px 6px 3px 0;white-space:normal}
.warn{background:var(--warnbg);border:0.5px solid var(--amber);color:var(--amber);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;margin:0 0 12px}
.hchip{display:inline-block;font-size:12px;font-weight:500;letter-spacing:0;padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:2px}
.salt{display:inline-block;margin-left:5px;vertical-align:-1px}
button{min-height:40px;min-width:40px}
#daybtns button{min-height:40px;min-width:46px}
#daysum tbody tr,#weeksum tbody tr{min-height:40px}
#wrap.mobile #daysum tbody td,#wrap.mobile #weeksum tbody td{padding-top:10px;padding-bottom:10px}
a:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
/* expert recommendation boxes */
.expert{--xc:#1D9E75;--xbg:rgba(29,158,117,0.08);border-left:3px solid var(--xc);background:var(--xbg);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 1.5rem;font-size:13px;line-height:1.5;box-sizing:border-box;width:100%;max-width:100%;overflow-wrap:anywhere}
.expert .xh{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--xc);margin:0 0 5px}
.expert ul{margin:0;padding:0 0 0 17px}
.expert li{margin:0 0 4px}
.expert li:last-child{margin:0}
.expert .xf{margin:6px 0 0;font-size:11px;color:var(--ts);font-style:italic}
.expert[data-role=coach]{--xc:#D85A30;--xbg:rgba(216,90,48,0.08)}
.expert[data-role=nutri]{--xc:#1D9E75;--xbg:rgba(29,158,117,0.08)}
.expert[data-role=md]{--xc:#A32D2D;--xbg:rgba(163,45,45,0.07)}
#wrap.dark .expert[data-role=coach]{--xc:#EE8B58;--xbg:rgba(216,90,48,0.16)}
#wrap.dark .expert[data-role=nutri]{--xc:#5FD0AA;--xbg:rgba(29,158,117,0.16)}
#wrap.dark .expert[data-role=md]{--xc:#E24B4A;--xbg:rgba(226,75,74,0.15)}
#wrap.mobile .expert{font-size:12px;padding:8px 10px}

 try{
  const s=String(d==null?'':d);
  const parts=s.split(' ');
  if(parts.length<2||!parts[1])return s;
  const dm=parts[1].split('-');
  if(dm.length<3)return s;
  const n=parseInt(dm[2],10);
  if(!isFinite(n))return s;
  return parts[0]+' '+n;
 }catch(e){return String(d==null?'':d);}
};

   xCarbLo:"UH {c} g prema {ct} g na dan tipa „{dt}” — {p}% plana. Prebaci {d} g koji nedostaju na dane treninga; ugljikohidrati se skidaju s dana odmora, ne s dana treninga.",
   xCarbHi:"UH {c} g prema {ct} g na dan tipa „{dt}” — {p}% plana, iznad cilja. U redu na dan treninga, vrijedi smanjiti na dan odmora.",
   xCarbOk:"UH {c} g prema {ct} g na dan tipa „{dt}” — {p}% plana. Nema što mijenjati.",
   xFillWorst:"Najdalje od cilja je {n} s {p}%. Popravi prvo to, prije svega ostalog.",
   xFillAll:"Sve trake su unutar 10% od cilja — dan je dobro složen; ponovi ga.",
   xVegNone:"Porcije povrća nisu zabilježene za {d}. Zabilježi ih — cilj je 5 porcija dnevno, a vlakna i mikronutrijenti prvi stradaju u dugom deficitu.",
   xVegLow:"{v} od 5 porcija povrća. Dodaj još {d} — zdjela salate i porcija mahunarki to zatvaraju.",
   xVegOk:"{v} od 5 porcija povrća — cilj ispunjen.",
   xBelowBmr:"Unos {i} kcal ispod je BMR-a od {b} kcal. Podigni ga na barem {b} kcal — deficit iskopan ispod BMR-a plaća se mišićem i hormonima, ne samo mašću.",
   xBigDef:"Deficit {v} kcal ({p}% od TDEE {t} kcal) — iznad granice od 1.200 kcal. Ograniči ga na 1.000 kcal/dan: vrati oko {a} kcal ugljikohidrata oko treninga.",
   xDefOk:"Deficit {v} kcal ({p}% od TDEE {t} kcal) — unutar pojasa 20–25%. Bez promjene.",
   xDefBand:"Deficit {v} kcal ({p}% od TDEE {t} kcal) — izvan pojasa 20–25%. Vrati ga hranom, ne dodatnim treningom.",
   xSurplus:"Neto višak {v} kcal na dan tipa „{dt}”. Jedan dan viška unutar tjednog deficita nije problem; dva zaredom jesu.",
   xUnderFuel:"Unos je {p}% dnevnog TDEE od {t} kcal na dan tipa „{dt}”. Stavi {g} g ugljikohidrata koji nedostaju u dva sata prije treninga, a ne poslije.",
   xLogN:"Zabilježenih stavki {d}: {n}, ukupno {k} kcal. Neizvagane stavke uobičajen su izvor razlike između ove tablice i vage — prvo izvagaj ulje i kruh.",
   xSaltN:"{n} od {m} stavki danas je pogodila heuristika soli. Natrij se ovdje nigdje stvarno ne mjeri — uz stabilan deficit, 1–2 kg tjednih oscilacija na vagi su sol i glikogenska voda, ne mast.",
   xSaltHi:"{n} označenih stavki u jednom danu puno je suhomesnatog i prerađenog. Drži se jedne dnevno i pij po žeđi; vaga će sljedeći tjedan biti čitljivija.",
   xDayMeanOver:"Prosječni deficit {v} kcal/dan kroz {n} zabilježenih dana — {p}% prosječnog TDEE od {t} kcal. To je iznad granice od 1.000 kcal/dan: vrati razliku na dane treninga.",
   xDayMeanBand:"Prosječni deficit {v} kcal/dan kroz {n} zabilježenih dana — {p}% prosječnog TDEE od {t} kcal, izvan pojasa 20–25%. Pomakni unos, ne trening.",
   xDayMeanOk:"Prosječni deficit {v} kcal/dan kroz {n} zabilježenih dana — {p}% prosječnog TDEE od {t} kcal, unutar pojasa 20–25%.",
   xDayBmr:"Unos je pao ispod BMR-a od {b} kcal na {n} od {m} zabilježenih dana. Podigni te dane na barem {b} kcal prije bilo kakvog daljnjeg rezanja.",
   xDayBmrOk:"Nijedan zabilježeni dan nije pao ispod BMR-a od {b} kcal — granica drži.",
   xCovLow:"{n}/7 dana zabilježeno za {w}. Bilježi svaki dan: uz {m} dan(a) koji nedostaje, tjedni deficit, implicirani TDEE i svi makro zbrojevi ispod su ekstrapolacije, a ne mjerenja.",
   xCovOk:"{n}/7 dana zabilježeno za {w} — dovoljna pokrivenost da se tjednim brojkama vjeruje.",
   xWeekDef:"Tjedni deficit {v} kcal, {a} kcal/dan. Na papiru je to {kg} kg masti u tjednu — provjeri to prema vagi u panelu usporedbe prije nego povjeruješ.",
   xWmProt:"Tjedni proteini {a} g prema cilju cijelog tjedna od {b} g ({d} g). Proteini su jedini makro koji treba pogoditi i na danima koje ne bilježiš.",
   xWmWorst:"Najdalje od cilja cijelog tjedna: {n}, {a} prema {b} ({d}). Popravi taj makro na {m} nezabilježenih dana.",
   xWmNoTgt:"Cilj cijelog tjedna nije izračunljiv dok se ne zna tip nezabilježenih dana — čitaj svedenu vrijednost umjesto njega.",
   xReconGap:"Dnevnik predviđa {x}, vaga je izmjerila {y} kroz {n} dana — razlika je oko {z} kcal/dan. Uz {l} od {n} zabilježenih dana, ta razlika je nezabilježeni unos, a ne spor metabolizam.",
   xReconClean:"Dnevnik predviđa {x}, vaga je izmjerila {y} kroz {n} dana — razlika je oko {z} kcal/dan.",
   xReconWeigh:"{n} dana između zadnja dva vaganja. Vagaj se tjedno, isto jutro, nakon WC-a i prije doručka — inače ovaj panel može uspoređivati samo dvomjesečne prosjeke.",
   xReconLog:"Bilježi svaki dan dva puna tjedna prije nego mijenjaš kalorije. Do tada je pošteno čitanje da je stvarni unos oko {z} kcal/dan iznad onoga što dnevnik kaže."}
};
let LBL=T.en;
const fill=(s,o)=>{let r=String(s);Object.keys(o).forEach(k=>{r=r.split('{'+k+'}').join(o[k]);});return r;};
const pct=(v,m)=>Math.min(100,Math.round(v/(m||1)*100));
const rawPct=(v,m)=>Math.round(v/(m||1)*100);
const bar=(lbl,val,max,unit)=>{const over=val>max;const w=pct(val,max);
  return `<div class="brow"><div class="bl"><span>${lbl}</span><b style="color:${over?'var(--amber)':'var(--tp)'}">${val}${unit} / ${max}${unit} · ${rawPct(val,max)}%${over?' · '+LBL.over:''}</b></div>
   <div class="track"><div class="fill" style="width:${w}%;background:${over?'var(--amber)':'var(--green)'}"></div></div></div>`;};
const proteinBar=(lbl,val,max,unit)=>{const met=val>=max;const w=pct(val,max);
  return `<div class="brow"><div class="bl"><span>${lbl}</span><b style="color:${met?'var(--green)':'var(--tp)'}">${val}${unit} / ${max}${unit} · ${rawPct(val,max)}%${met?' ✓':''}</b></div>
   <div class="track"><div class="fill" style="width:${w}%;background:${met?'var(--green)':'var(--blue)'}"></div></div></div>`;};
/* carbs / fat / veg: BOTH ends matter — under 90% of target is flagged as well as over */
const macroBar=(lbl,val,max,unit)=>{const p=rawPct(val,max);const over=val>max,under=p<90;const w=pct(val,max);
  const col=(over||under)?'var(--amber)':'var(--tp)';const fillc=(over||under)?'var(--amber)':'var(--green)';
  const tag=over?' · '+LBL.over:(under?' · '+LBL.under:'');
  return `<div class="brow"><div class="bl"><span>${lbl}</span><b style="color:${col}">${val}${unit} / ${max}${unit} · ${p}%${tag}</b></div>
   <div class="track"><div class="fill" style="width:${w}%;background:${fillc}"></div></div></div>`;};
const chip=(txt,col)=>`<span class="chip" style="color:${col||'var(--amber)'}">${txt}</span>`;

/* ---- expert recommendation boxes ----
   Rule-based and rebuilt from the live data on every render, so the advice
   follows a refresh instead of going stale. */
const xesc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const xi=v=>(v==null||!isFinite(v))?'—':Math.round(v).toLocaleString();
function xHtml(role,bullets){
 const head={coach:LBL.xCoach,nutri:LBL.xNutri,md:LBL.xMd}[role]||LBL.xNutri;
 const list=(bullets||[]).filter(b=>b!=null&&b!=='');
 if(!list.length)list.push(LBL.xNoData);
 return `<div class="expert" data-role="${role}"><div class="xh">${xesc(head)}</div><ul>`
  +list.map(b=>'<li>'+xesc(b)+'</li>').join('')+'</ul>'
  +(role==='md'?`<div class="xf">${xesc(LBL.xDisc)}</div>`:'')+'</div>';
}

/* ---- safety helpers ---- */
function defBand(deficit,tdee){const p=tdee?(deficit/tdee*100):0;return{p:Math.round(p),inBand:p>=20&&p<=25};}
function defColor(deficit,tdee){
 if(deficit<0)return'var(--red)';
 const b=defBand(deficit,tdee);
 return (b.inBand&&deficit<=1200)?'var(--green)':'var(--amber)';
}
const SALT_RE=/vegeta|dimljen|smoked|oliv|maslin|soup|juha|mayo|parmigiano|sriracha|salam|pršut/i;
const isSalty=n=>SALT_RE.test(String(n||''));
const saltIcon=()=>`<span class="salt" title="${LBL.naAria}" aria-label="${LBL.naAria}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 21h7l-1-9h-5z"/><path d="M9.5 12V6a2.5 2.5 0 0 1 5 0v6"/><path d="M11 3.6h2"/></svg></span>`;

function render(){
 if(!DATA||!DAYS.length){return;}
 const k=DAYS[daySel],tgt=k.target||{kcal:0,p:0,c:0,f:0};
 const tot=k.total||k.log.reduce((a,f)=>({kcal:a.kcal+(+f.kcal||0),p:a.p+(+f.p||0),c:a.c+(+f.c||0),f:a.f+(+f.f||0)}),{kcal:0,p:0,c:0,f:0});
 const bal=k.tdee-tot.kcal;
 const ath=DATA.athlete||{};
 const wKg=ath.weightKg||null;
 const bmr=ath.bmr||null;
 const goalKg=(WEIGHT&&WEIGHT.config&&WEIGHT.config.targetKg)||null;
 document.getElementById('sub').textContent=k.date+" · "+k.dayType+(wKg?" · "+wKg+" kg":"");
 const card=(lab,val,sub,col,extra)=>`<div class="card"><div class="lab">${lab}</div><div style="font-size:24px;font-weight:500;${col?'color:'+col:''}">${val}</div><div class="sub">${sub}</div>${extra||''}</div>`;
 const intakeW=Math.min(100,Math.round(tot.kcal/(k.tdee||1)*100));
 const intakeRatio=k.tdee?tot.kcal/k.tdee:0;
 const pMet=tot.p>=tgt.p, pGap=tgt.p-tot.p;

 /* ---- per-kg (U3) ---- */
 const gkg=v=>wKg?(v/wKg):null;
 const f2=v=>v===null?'—':v.toFixed(2);
 const pPerKg=gkg(tot.p), cPerKg=gkg(tot.c);
 const pBandCol=pPerKg===null?'var(--ts)':((pPerKg>=1.6&&pPerKg<=2.2)?'var(--green)':'var(--amber)');
 const pBandTxt=pPerKg===null?'':(pPerKg<1.6?LBL.pBandLo:(pPerKg>2.2?LBL.pBandHi:LBL.pBandOk));
 const pGoal=goalKg?(tot.p/goalKg):null, cGoal=goalKg?(tot.c/goalKg):null;
 const pExtra=`<div class="sub" style="margin-top:4px;"><b style="color:${pBandCol};font-weight:500;">${f2(pPerKg)} ${LBL.perKg}</b> <span class="mini">· ${pBandTxt}</span></div>`
  +(pGoal!==null?`<div class="mini" style="opacity:.7;">${f2(pGoal)} ${LBL.perKg} · ${fill(LBL.atGoal,{w:goalKg})}</div>`:'');
 const cExtra=`<div class="sub" style="margin-top:4px;">${f2(cPerKg)} ${LBL.perKg}</div>`
  +(cGoal!==null?`<div class="mini" style="opacity:.7;">${f2(cGoal)} ${LBL.perKg} · ${fill(LBL.atGoal,{w:goalKg})}</div>`:'');

 /* ---- safety flags (U5 / U6) ---- */
 const band=defBand(bal,k.tdee);
 const balCol=defColor(bal,k.tdee);
 const flags=[];
 if(bmr&&tot.kcal<bmr)flags.push(chip(fill(LBL.belowBmr,{n:bmr.toLocaleString()})));
 if(bal>1200)flags.push(chip(LBL.bigDef));
 if(bal>=0)flags.push(chip(band.p+'% '+LBL.ofTdee+' · '+(band.inBand?LBL.bandOk:LBL.bandOut),band.inBand?'var(--green)':'var(--amber)'));
 if(tot.f<60)flags.push(chip(LBL.fatFloor));
 if(k.dayType&&/training/i.test(k.dayType)&&intakeRatio<0.60)flags.push(chip(fill(LBL.underFuel,{n:Math.round(intakeRatio*100)})));

 /* ---- veg / fibre (U7) ---- */
 const vegN=(typeof k.veg==='number'&&isFinite(k.veg))?k.veg:null;
 const wgG=(typeof k.wholegrainG==='number'&&isFinite(k.wholegrainG))?k.wholegrainG:0;
 const vegHtml=vegN!==null
  ?macroBar(LBL.veg,vegN,5,LBL.vegUnit)+`<div class="mini" style="margin-top:-6px;">${fill(LBL.fibre,{n:Math.round(vegN*3+wgG/50*2)})}</div>`
  :`<div class="sub" style="opacity:.75;">${LBL.vegNone}</div>`;

 /* ---- sodium heuristic (U8) ---- */
 const saltCount=k.log.reduce((a,f)=>a+(isSalty(f.name)?1:0),0);

 const insColor=pMet?'var(--green)':'var(--amber)';
 const insHeadEn=pMet?('Protein '+tot.p+'g — on target'):('Protein '+tot.p+'g — '+pGap+'g under target');
 const insHeadHr=pMet?('Proteini '+tot.p+'g — na cilju'):('Proteini '+tot.p+'g — '+pGap+'g ispod cilja');
 const balEn=bal>=0?(bal+' kcal deficit'):(Math.abs(bal)+' kcal surplus');
 const balHr=bal>=0?(bal+' kcal deficit'):(Math.abs(bal)+' kcal višak');
 const insBodyEn='Net balance is a '+balEn+' ('+band.p+'% of a ~'+k.tdee.toLocaleString()+' TDEE) on a '+k.dayType+'. '
  +(pMet?('Protein hit the '+tgt.p+'g target ('+f2(pPerKg)+' g/kg). '):('Protein landed '+pGap+'g short of the '+tgt.p+'g target ('+f2(pPerKg)+' g/kg). '))
  +'Carbs '+tot.c+'g · fat '+tot.f+'g'+(tot.f<60?' — fat is under the 60 g floor. ':'. ')
  +(bmr&&tot.kcal<bmr?('Intake is below BMR ('+bmr.toLocaleString()+' kcal). '):'')
  +(saltCount?(saltCount+' item'+(saltCount===1?'':'s')+' flagged by the salt heuristic.'):'');
 const insBodyHr='Neto bilanca je '+balHr+' ('+band.p+'% od ~'+k.tdee.toLocaleString()+' TDEE), dan: '+k.dayType+'. '
  +(pMet?('Proteini su dosegli cilj od '+tgt.p+'g ('+f2(pPerKg)+' g/kg). '):('Proteini su '+pGap+'g ispod cilja od '+tgt.p+'g ('+f2(pPerKg)+' g/kg). '))
  +'UH '+tot.c+'g · masti '+tot.f+'g'+(tot.f<60?' — masti su ispod praga od 60 g. ':'. ')
  +(bmr&&tot.kcal<bmr?('Unos je ispod BMR-a ('+bmr.toLocaleString()+' kcal). '):'')
  +(saltCount?(saltCount+' stavki označeno heuristikom soli.'):'');

 /* ---- expert boxes for this day (nutritionist) ---- */
 const pFloor=wKg?Math.ceil(1.6*wKg):null;
 const xProt=pPerKg===null?null
  :(pPerKg<1.6?fill(LBL.xProLo,{p:tot.p,g:f2(pPerKg),n:pFloor})
   :(pPerKg>2.2?fill(LBL.xProHi,{p:tot.p,g:f2(pPerKg)})
    :fill(LBL.xProOk,{p:tot.p,g:f2(pPerKg)})));
 const xFat=tot.f<60?fill(LBL.xFatLo,{f:tot.f,d:Math.max(0,60-tot.f)}):fill(LBL.xFatOk,{f:tot.f});
 const cP=rawPct(tot.c,tgt.c);
 const xCarb=cP<90?fill(LBL.xCarbLo,{c:tot.c,ct:tgt.c,dt:k.dayType,p:cP,d:Math.max(0,tgt.c-tot.c)})
  :(tot.c>tgt.c?fill(LBL.xCarbHi,{c:tot.c,ct:tgt.c,dt:k.dayType,p:cP})
   :fill(LBL.xCarbOk,{c:tot.c,ct:tgt.c,dt:k.dayType,p:cP}));
 const xMacrosBox=xHtml('nutri',[xProt,xFat,xCarb]);
 const barsP=[{n:LBL.cal,p:rawPct(tot.kcal,tgt.kcal)},{n:LBL.prot,p:rawPct(tot.p,tgt.p)},{n:LBL.carb,p:cP},{n:LBL.fat,p:rawPct(tot.f,tgt.f)}];
 let worstBar=barsP[0];barsP.forEach(x=>{if(Math.abs(100-x.p)>Math.abs(100-worstBar.p))worstBar=x;});
 const xVeg=vegN===null?fill(LBL.xVegNone,{d:k.date})
  :(vegN<5?fill(LBL.xVegLow,{v:vegN,d:5-vegN}):fill(LBL.xVegOk,{v:vegN}));
 const xFillBox=xHtml('nutri',[Math.abs(100-worstBar.p)>10?fill(LBL.xFillWorst,{n:worstBar.n,p:worstBar.p}):LBL.xFillAll,xVeg]);
 const xEn=[];
 if(bmr&&tot.kcal<bmr)xEn.push(fill(LBL.xBelowBmr,{i:tot.kcal.toLocaleString(),b:bmr.toLocaleString()}));
 if(bal<0)xEn.push(fill(LBL.xSurplus,{v:Math.abs(bal).toLocaleString(),dt:k.dayType}));
 else if(bal>1200)xEn.push(fill(LBL.xBigDef,{v:bal.toLocaleString(),p:band.p,t:k.tdee.toLocaleString(),a:xi(bal-1000)}));
 else if(band.inBand)xEn.push(fill(LBL.xDefOk,{v:bal.toLocaleString(),p:band.p,t:k.tdee.toLocaleString()}));
 else xEn.push(fill(LBL.xDefBand,{v:bal.toLocaleString(),p:band.p,t:k.tdee.toLocaleString()}));
 if(k.dayType&&/training/i.test(k.dayType)&&intakeRatio<0.60)
  xEn.push(fill(LBL.xUnderFuel,{p:Math.round(intakeRatio*100),t:k.tdee.toLocaleString(),dt:k.dayType,g:Math.max(0,tgt.c-tot.c)}));
 const xEnergyBox=xHtml('nutri',xEn);
 const xLogBox=xHtml('nutri',[fill(LBL.xLogN,{n:k.log.length,d:k.date,k:tot.kcal.toLocaleString()}),xVeg]);
 const xSaltBox=xHtml('nutri',[fill(LBL.xSaltN,{n:saltCount,m:k.log.length}),saltCount>=3?fill(LBL.xSaltHi,{n:saltCount}):null]);
 let covN=0,covLabel='';
 try{const wks=computeWeeks();const mk=isoStr(mondayOf(parseISODate(k.date)));const w=wks.find(x=>x.monKey===mk);
  if(w){covN=w.days.length;covLabel=weekLabel(w.mon,w.sun);}}catch(e){covN=0;}
 const xInsBox=xHtml('nutri',[xEn[0]||xProt||xFat||xCarb,
  covN?(covN<6?fill(LBL.xCovLow,{n:covN,w:covLabel,m:7-covN}):fill(LBL.xCovOk,{n:covN,w:covLabel})):null]);

 const html=`
  <div class="h">${LBL.macros}</div>
  <div class="cards">
   ${card(LBL.cal,tot.kcal.toLocaleString(),'/ '+tgt.kcal.toLocaleString()+' '+LBL.target,'')}
   ${card(LBL.prot,tot.p+'g','/ '+tgt.p+'g'+(tot.p>=tgt.p?' ✓':''),'var(--green)',pExtra)}
   ${card(LBL.carb,tot.c+'g','/ '+tgt.c+'g','',cExtra)}
   ${card(LBL.fat,tot.f+'g','/ '+tgt.f+'g'+(tot.f<60?' ⚠':''),tot.f<60?'var(--amber)':'')}
  </div>
  ${xMacrosBox}
  <div class="h">${LBL.fill}</div>
  <div class="bars">
   ${bar(LBL.cal,tot.kcal,tgt.kcal,'')}
   ${proteinBar(LBL.prot,tot.p,tgt.p,'g')}
   ${macroBar(LBL.carb,tot.c,tgt.c,'g')}
   ${macroBar(LBL.fat,tot.f,tgt.f,'g')}
   ${vegHtml}
  </div>
  ${xFillBox}
  <div class="h">${LBL.energy}</div>
  <div style="margin:0 0 1.5rem;">
   <div class="bl" style="display:flex;justify-content:space-between;font-size:13px;color:var(--ts);margin-bottom:5px;"><span>${LBL.burn}</span><b style="color:var(--tp)">~${k.tdee.toLocaleString()}</b></div>
   <div class="track" style="height:13px;margin-bottom:12px;"><div class="fill" style="width:100%;background:var(--blue)"></div></div>
   ${k.tdeeNote?`<div class="sub" style="margin:-6px 0 10px;font-size:11px;font-style:italic;" title="${k.tdeeNote}">${k.tdeeNote}</div>`:''}
   <div class="bl" style="display:flex;justify-content:space-between;font-size:13px;color:var(--ts);margin-bottom:5px;"><span>${LBL.intake}</span><b style="color:${balCol}">${tot.kcal.toLocaleString()} · ${bal>=0?LBL.deficit+' −'+bal.toLocaleString()+' ('+band.p+'% '+LBL.ofTdee+')':LBL.surplus+' +'+Math.abs(bal).toLocaleString()}</b></div>
   <div class="track" style="height:13px;"><div class="fill" style="width:${intakeW}%;background:var(--cyan)"></div></div>
   ${flags.length?`<div style="margin-top:10px;">${flags.join('')}</div>`:''}
  </div>
  ${xEnergyBox}
  <div class="h">${LBL.foodlog}</div>
  <table>
   <thead><tr><th>${LBL.item}</th><th>kcal</th><th>P</th><th>C</th><th>F</th></tr></thead>
   <tbody>${k.log.map(f=>`<tr><td>${f.name}${isSalty(f.name)?saltIcon():''}</td><td>${f.kcal}</td><td>${f.p}</td><td>${f.c}</td><td>${f.f}</td></tr>`).join('')}</tbody>
   <tfoot><tr><td>${LBL.total}</td><td>${tot.kcal}</td><td>${tot.p}</td><td>${tot.c}</td><td>${tot.f}</td></tr></tfoot>
  </table>
  ${xLogBox}

/* ---- weekly aggregation (Mon–Sun), derived at render time ---- */
const MONTHS={en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
 hr:['sij','velj','ožu','tra','svi','lip','srp','kol','ruj','lis','stu','pro']};
function parseISODate(dstr){const iso=String(dstr).split(' ')[1];if(!iso)return new Date(NaN);const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function parseISODateStr(s){const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);}
function isoStr(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function mondayOf(dt){const day=dt.getDay();const diff=(day===0?-6:1-day);return new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+diff);}
function weekLabel(mon,sun){const mo=MONTHS[lang]||MONTHS.en;const sameYear=mon.getFullYear()===sun.getFullYear();
 const a=mon.getDate()+' '+mo[mon.getMonth()];const b=sun.getDate()+' '+mo[sun.getMonth()]+(sameYear?'':' '+sun.getFullYear());
 return a+' – '+b;}
function dayMetrics(d,base){
 const tot=d.total||d.log.reduce((a,f)=>({kcal:a.kcal+(+f.kcal||0),p:a.p+(+f.p||0),c:a.c+(+f.c||0),f:a.f+(+f.f||0)}),{kcal:0,p:0,c:0,f:0});
 const intake=tot.kcal; /* same source as the day view, so the two can never disagree */
 const tdee=d.tdee,ex=Math.max(0,tdee-base),deficit=tdee-intake;
 return{intake,base,ex,tdee,deficit,tot};
}
function computeWeeks(){
 const map=new Map();
 (DATA.days||[]).forEach(d=>{
  const mon=mondayOf(parseISODate(d.date));
  const key=isoStr(mon);
  if(!map.has(key))map.set(key,{monKey:key,mon,sun:new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6),days:[]});
  map.get(key).days.push(d);
 });
 return Array.from(map.values()).sort((a,b)=>a.monKey<b.monKey?-1:a.monKey>b.monKey?1:0);
}
/* integer split of `total` across `weights`, largest-remainder — deterministic, sums exactly */
function largestRemainder(weights,total){
 const keys=Object.keys(weights);
 const out={};keys.forEach(k=>{out[k]=0;});
 const sumW=keys.reduce((a,k)=>a+Math.max(0,+weights[k]||0),0);
 if(!(total>0)||sumW<=0)return out;
 const rem=[];let used=0;
 keys.forEach(k=>{const exact=Math.max(0,+weights[k]||0)/sumW*total;const n=Math.floor(exact);out[k]=n;used+=n;rem.push({k,r:exact-n});});
 rem.sort((a,b)=>b.r-a.r);
 for(let i=0;used<total;i++,used++)out[rem[i%rem.length].k]++;
 return out;
}
const shortDayType=t=>String(t==null?'':t).replace(/\s+(day|dan)$/i,'');
/* full-week target: sum the real per-day targets, then fill the unlogged days from the
   REMAINING plan slots in targets.weekSplit (4 training + 3 rest), never from the
   dominant logged type — flagged as an assumption, never silent */
function fullWeekTarget(w){
 const TT=(DATA&&DATA.targets)||null;
 const miss=Math.max(0,7-w.days.length);
 const sum=w.days.reduce((a,d)=>{const t=d.target||{};return{kcal:a.kcal+(+t.kcal||0),p:a.p+(+t.p||0),c:a.c+(+t.c||0),f:a.f+(+t.f||0)};},{kcal:0,p:0,c:0,f:0});
 if(!miss)return{t:sum,miss:0,mixTxt:null};
 const loggedCount=new Map();
 w.days.forEach(d=>{const key=d.dayType||'';if(key)loggedCount.set(key,(loggedCount.get(key)||0)+1);});
 const split=(TT&&TT.weekSplit&&typeof TT.weekSplit==='object')?TT.weekSplit:null;
 let mixCounts=null;
 if(split){
  /* remaining slots = plan − already logged of that type, floored at 0: days logged
     beyond a type's plan count keep their own type and simply consume no slot */
  const plan={},remaining={};
  Object.keys(split).forEach(k=>{plan[k]=Math.max(0,+split[k]||0);remaining[k]=Math.max(0,plan[k]-(loggedCount.get(k)||0));});
  const R=Object.keys(remaining).reduce((a,k)=>a+remaining[k],0);
  if(R>=miss){mixCounts=largestRemainder(remaining,miss);}
  else{mixCounts=Object.assign({},remaining);
   const extra=largestRemainder(plan,miss-R);
   Object.keys(extra).forEach(k=>{mixCounts[k]=(mixCounts[k]||0)+extra[k];});}
 }else{
  /* no weekSplit in data.json → fall back to the week's dominant logged dayType */
  let domType=null,domN=-1;
  loggedCount.forEach((v,key)=>{if(v>domN){domN=v;domType=key;}});
  if(domType){mixCounts={};mixCounts[domType]=miss;}
 }
 if(!mixCounts)return{t:null,miss,mixTxt:null};
 const add={kcal:0,p:0,c:0,f:0};const parts=[];let ok=true;
 Object.keys(mixCounts).forEach(k=>{
  const n=mixCounts[k];if(!n)return;
  let at=(TT&&TT[k])||null;
  if(!at){const src=w.days.find(d=>d.dayType===k);at=(src&&src.target)?src.target:null;}
  if(!at){ok=false;return;}
  add.kcal+=(+at.kcal||0)*n;add.p+=(+at.p||0)*n;add.c+=(+at.c||0)*n;add.f+=(+at.f||0)*n;
  parts.push(n+' '+shortDayType(k));
 });
 if(!ok||!parts.length)return{t:null,miss,mixTxt:null};
 return{t:{kcal:sum.kcal+add.kcal,p:sum.p+add.p,c:sum.c+add.c,f:sum.f+add.f},miss,mixTxt:parts.join(' + ')};
}
function weekAggregate(w){
 const base=(DATA.athlete&&DATA.athlete.restTdee)||0;
 const metrics=w.days.map(d=>dayMetrics(d,base));
 const n=metrics.length;
 const sum=k=>metrics.reduce((a,m)=>a+m[k],0);
 const intake=sum('intake'),baseSum=base*n,ex=sum('ex'),tdee=sum('tdee'),deficit=sum('deficit');
 const avgIntake=n?Math.round(intake/n):0,avgDeficit=n?Math.round(deficit/n):0,avgTdee=n?Math.round(tdee/n):0;
 const actual=metrics.reduce((a,m)=>({kcal:a.kcal+m.tot.kcal,p:a.p+m.tot.p,c:a.c+m.tot.c,f:a.f+m.tot.f}),{kcal:0,p:0,c:0,f:0});
 const target=w.days.reduce((a,d)=>{const t=d.target||{};return{kcal:a.kcal+(+t.kcal||0),p:a.p+(+t.p||0),c:a.c+(+t.c||0),f:a.f+(+t.f||0)};},{kcal:0,p:0,c:0,f:0});
 const fw=fullWeekTarget(w);
 return{n,intake,base:baseSum,ex,tdee,deficit,avgIntake,avgDeficit,avgTdee,actual,target,fullWeekTarget:fw.t,fwMiss:fw.miss,fwMixTxt:fw.mixTxt};
}
function weekWeightDelta(w){
 const entries=(WEIGHT&&WEIGHT.weeks)||[];
 if(!entries.length)return null;
 const monStr=isoStr(w.mon),sunStr=isoStr(w.sun);
 let curr=null;
 entries.forEach(e=>{if(e.d>=monStr&&e.d<=sunStr){if(!curr||e.d>curr.d)curr=e;}});
 if(!curr)return null;
 let prev=null;
 entries.forEach(e=>{if(e.d<monStr){if(!prev||e.d>prev.d)prev=e;}});
 if(!prev)return null;
 const delta=Math.round((curr.w-prev.w)*10)/10;
 const spanDays=Math.round((parseISODateStr(curr.d)-parseISODateStr(prev.d))/86400000);
 return{delta,spanDays,curr,prev};
}
/* U9: weigh-in staleness — stale asOf, or a >14 d gap between the last two weigh-ins */
function weighStaleChips(){
 if(!WEIGHT)return'';
 const out=[];
 const ws=((WEIGHT.weeks)||[]).slice().sort((a,b)=>a.d<b.d?-1:(a.d>b.d?1:0));
 if(ws.length>=2){
  const gap=Math.round((parseISODateStr(ws[ws.length-1].d)-parseISODateStr(ws[ws.length-2].d))/86400000);
  if(gap>14)out.push(chip(fill(LBL.rStaleGap,{n:gap})));
 }
 const asOf=WEIGHT.meta&&WEIGHT.meta.asOf;
 if(asOf){
  const age=Math.round((new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())-parseISODateStr(asOf))/86400000);
  if(isFinite(age)&&age>14)out.push(chip(fill(LBL.rStaleAs,{n:age})));
 }
 return out.join('');
}
function renderWeekMacros(weeks){

/* ---- U2: reconciliation — what the log predicts vs what the scale did ----

   not comparable at all, so the panel switches to a RATE comparison and says so. */
function renderRecon(){

   <div style="font-size:22px;font-weight:500;${col?'color:'+col:''}">${val}</div><div class="mini">${sub||''}</div></div>`;
 const noData=()=>{el.innerHTML=head+`<div class="note"><p class="lab" style="margin:0;">${LBL.rNoW}</p></div>
  <div class="cards" style="margin-top:12px;">
   ${bigCard(LBL.rPred,'—','')}
   ${bigCard(LBL.rAct,'—','')}
   ${bigCard(LBL.rCov,'—','')}
   ${bigCard(LBL.rTdee,'—','')}
   ${bigCard(LBL.rAcc,'—',LBL.rAccNote)}
  </div>`;};
 const ws=((WEIGHT&&WEIGHT.weeks)||[]).slice().filter(e=>e&&e.d&&isFinite(+e.w)).sort((a,b)=>a.d<b.d?-1:(a.d>b.d?1:0));
 if(ws.length<2){noData();return;}
 const curr=ws[ws.length-1],prev=ws[ws.length-2];
 const spanDays=Math.round((parseISODateStr(curr.d)-parseISODateStr(prev.d))/86400000);
 if(!isFinite(spanDays)||spanDays<=0){noData();return;}
 const base=(DATA.athlete&&DATA.athlete.restTdee)||0;
 const isoOf=d=>String((d&&d.date)||'').split(' ')[1]||'';
 const inSpan=DAYS.filter(d=>{const iso=isoOf(d);return iso&&iso>prev.d&&iso<=curr.d;});
 const spanLogged=inSpan.length;
 const coverage=spanLogged/spanDays;
 const covPct=Math.round(coverage*100);
 const unreliable=coverage<0.6;
 const rateMode=spanLogged<1;                    /* nothing logged inside the span */
 const actualKg=Math.round((prev.w-curr.w)*100)/100;   /* + = weight lost */
 const src=rateMode?DAYS:inSpan;                 /* rate mode falls back to every logged day */
 const met=src.map(d=>dayMetrics(d,base));
 const nUsed=met.length;
 const sumDef=met.reduce((a,m)=>a+m.deficit,0);
 const meanIntake=nUsed?met.reduce((a,m)=>a+m.intake,0)/nUsed:0;
 const meanTdee=nUsed?met.reduce((a,m)=>a+m.tdee,0)/nUsed:0;
 const kg=v=>(v>=0?'−':'+')+Math.abs(v).toFixed(2)+' kg';   /* loss shown as a minus */
 const kg1=v=>(v>=0?'−':'+')+Math.abs(v).toFixed(1)+' kg';
 const kgw=v=>(v>=0?'−':'+')+Math.abs(v).toFixed(2)+' '+LBL.rKgWeek;
 const num=v=>(v===null||!isFinite(v))?'—':Math.round(v).toLocaleString();
 let predLab,predVal,predSub,actLab,actVal,impliedTDEE,gap,ratio,verdict;
 if(rateMode){
  const predictedRate=nUsed?(sumDef/nUsed)*7/7700:0;      /* kg/week the log implies */
  const measuredRate=actualKg/(spanDays/7);               /* kg/week the scale measured */
  impliedTDEE=Math.round(meanIntake+measuredRate*7700/7);
  gap=Math.round(meanTdee-impliedTDEE);
  ratio=predictedRate!==0?measuredRate/predictedRate:null;
  predLab=LBL.rPredRate;predVal=kgw(predictedRate);predSub=fill(LBL.rFromLogged,{n:nUsed});
  actLab=LBL.rActRate;actVal=kgw(measuredRate);
  verdict=fill(LBL.rVerdictRate,{x:kgw(predictedRate),y:kgw(measuredRate),n:spanDays,z:Math.abs(gap).toLocaleString()});
 }else{
  const predictedKg=sumDef/7700;
  impliedTDEE=Math.round(meanIntake+actualKg*7700/spanDays);
  gap=Math.round(meanTdee-impliedTDEE);
  ratio=predictedKg!==0?actualKg/predictedKg:null;
  predLab=LBL.rPred;predVal=kg(predictedKg);predSub=fill(LBL.rFromLogged,{n:nUsed});
  actLab=LBL.rAct;actVal=kg1(actualKg);
  verdict=fill(unreliable?LBL.rVerdict:LBL.rVerdictClean,
    {x:kg(predictedKg),y:kg1(actualKg),n:spanDays,z:Math.abs(gap).toLocaleString(),l:spanLogged});
 }
 const covSub=[fill(LBL.rCovLine,{l:spanLogged,n:spanDays})+(rateMode?' — '+LBL.rRateMode:'')+'.']
  .concat(unreliable?[LBL.rUnrel]:[]).join(' ');
 const warnBox=unreliable
  ?`<div class="warn" style="font-size:14px;font-weight:500;">${spanLogged}/${spanDays} ${LBL.rOfSpan} (${covPct}%) — ${LBL.rUnreliable}</div>`
  :'';
 el.innerHTML=head
  +warnBox
  +`<div class="sub" style="margin:0 0 10px;">${covSub}</div>`
  +`<div class="cards">
   ${bigCard(predLab,predVal,predSub,'var(--tp)')}
   ${bigCard(actLab,actVal,fill(LBL.rOverSpan,{n:spanDays}),actualKg>=0?'var(--green)':'var(--red)')}
   ${bigCard(LBL.rCov,spanLogged+'/'+spanDays,covPct+'% · '+LBL.rOfSpan,unreliable?'var(--amber)':'var(--green)')}
   ${bigCard(LBL.rTdee,num(impliedTDEE),fill(LBL.rVsLogged,{n:num(meanTdee)}),unreliable?'var(--ts)':'var(--tp)')}
   ${bigCard(LBL.rAcc,(ratio===null||!isFinite(ratio))?'—':(ratio.toFixed(2)+'×'),LBL.rAccNote,unreliable?'var(--amber)':'var(--tp)')}
  </div>
  <div class="note">
   <p class="lab" style="margin:0 0 6px;line-height:1.6;">${verdict}</p>
   <p class="mini" style="margin:0;line-height:1.6;">${fill(LBL.rSpanNote,{a:prev.d,b:curr.d,pw:prev.w,cw:curr.w,n:spanDays})}</p>
   <div style="margin-top:8px;">${weighStaleChips()}</div>
  </div>`
  +xHtml('nutri',[
    fill(unreliable?LBL.xReconGap:LBL.xReconClean,
     {x:predVal,y:actVal,n:spanDays,z:Math.abs(gap).toLocaleString(),l:spanLogged}),
    spanDays>14?fill(LBL.xReconWeigh,{n:spanDays}):null,
    unreliable?fill(LBL.xReconLog,{z:Math.abs(gap).toLocaleString()}):null
   ]);
}

applyTheme(theme);applyResponsive();markBtns();
window.addEventListener('resize',applyResponsive);

let WEIGHT=null;
fetch('data.json',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
 .then(j=>{DATA=j;DAYS=DATA.days||(DATA.intake?[DATA.intake]:[]);daySel=DAYS.length-1;renderDayBtns();renderSummary();render();renderWeekly();renderRecon();})
 .catch(err=>{document.getElementById('content').innerHTML=
   `<div class="state">Couldn't load data.json (${err.message}).<br><br>If you opened this file directly, serve it over http (it works on GitHub Pages).</div>`;});

fetch('weight-data.json',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
 .then(j=>{WEIGHT=j;if(DATA){render();renderWeekly();renderRecon();}})
 .catch(()=>{WEIGHT=null;if(DATA){render();renderWeekly();renderRecon();}});
</script>
</body>
</html>
