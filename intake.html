<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrik's intake</title>
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'><rect%20width='32'%20height='32'%20rx='7'%20fill='%231D9E75'/><path%20d='M11%208v7a3%203%200%200%200%206%200V8M14%2015v9'%20fill='none'%20stroke='%23fff'%20stroke-width='2'%20stroke-linecap='round'/><path%20d='M22%208c-2%200-3%203-3%207s1%204%203%204%200-2%200-5-1-6-3-6z'%20fill='%23fff'/></svg>">
<style>
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:20px;transition:background .2s}
#wrap{--bg:#ffffff;--surf:#f1efe8;--tp:#1a1a18;--ts:rgba(0,0,0,0.62);--bd:rgba(0,0,0,0.28);background:var(--bg);color:var(--tp);padding:16px;border-radius:12px;width:100%;max-width:900px;margin:0 auto;box-sizing:border-box}
#wrap.dark{--bg:#262624;--surf:#33322f;--tp:#ffffff;--ts:rgba(255,255,255,0.72);--bd:rgba(255,255,255,0.22)}
#wrap.mobile{padding:14px}
#wrap.big{zoom:1.5;width:calc(100%/1.5);max-width:600px}
.card{background:var(--surf);border-radius:8px;padding:0.85rem 1rem}
.lab{font-size:13px;color:var(--ts)}
.sub{font-size:12px;color:var(--ts)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0 0 1.25rem}
#wrap.mobile .cards{grid-template-columns:1fr 1fr;gap:10px}
.h{font-size:16px;font-weight:500;letter-spacing:0.08em;margin:0 0 0.75rem}
.bars{display:flex;flex-direction:column;gap:13px;margin:0 0 1.5rem}
.brow .bl{display:flex;justify-content:space-between;font-size:13px;color:var(--ts);margin-bottom:5px}
.brow .bl b{color:var(--tp);font-weight:500}
.track{background:var(--surf);height:9px;border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px;transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 1.5rem}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ts);text-align:right;padding:0 8px 8px;font-weight:500}
th:first-child{text-align:left;padding-left:4px}
td{padding:8px;text-align:right;font-variant-numeric:tabular-nums;border-top:0.5px solid var(--bd)}
td:first-child{text-align:left;color:var(--ts);padding-left:4px}
tfoot td{font-weight:600;border-top:1px solid var(--bd)}
#wrap.mobile #daysum table,#wrap.mobile #weeksum table{font-size:11px}
#wrap.mobile #daysum th,#wrap.mobile #daysum td,#wrap.mobile #weeksum th,#wrap.mobile #weeksum td{padding:5px 4px}
.note{background:var(--bg);border:0.5px solid var(--bd);border-radius:12px;padding:1rem 1.25rem;margin-bottom:0.25rem;line-height:1.6}
.state{text-align:center;padding:60px 20px;color:var(--ts);font-size:13px}
</style>
</head>
<body>
<div id="wrap">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 1.25rem;flex-wrap:wrap;">
  <div class="ttl" data-i="title" style="font-size:20px;font-weight:500;letter-spacing:0.04em;">PATRIK'S INTAKE</div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
    <button id="btn-en" onclick="setLang('en')">EN</button>
    <button id="btn-hr" onclick="setLang('hr')">HR</button>
    <button id="btn-fs" onclick="toggleFont()" aria-label="Large font"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-3px" aria-hidden="true"><circle cx="9" cy="10" r="4.5"/><path d="M12.2 13.2L16 17"/><path d="M7 10h4M9 8v4"/></svg></button>
  </div>
</div>

<div id="sub" class="sub" style="margin:0 0 1rem;"></div>

<div id="daybtns" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;"></div>
<div id="daysum" style="margin:0 0 1.25rem;"></div>
<div id="weeksum" style="margin:0 0 1.25rem;"></div>

<div id="content"><div class="state">Loading…</div></div>

<p class="lab" style="font-size:11px;margin:10px 2px 0;"><span data-i="foot">Intake logged live · macro targets per plan</span> · Intake Dashboard, part of Daily Dashboard · by <a href="mailto:patrik.pencinger@gmail.com" style="color:inherit;">Patrik Pencinger</a></p>
</div>

<script>
let theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
let lang='en',fontbig=false,layout='';
let DATA=null;
let DAYS=[],daySel=0;
const shortLabel=d=>{const parts=d.split(' ');const dm=parts[1].split('-');return parts[0]+' '+parseInt(dm[2],10);};
const T={
 en:{title:"PATRIK'S INTAKE",macros:"MACROS VS TARGET",fill:"FILL RATE",energy:"ENERGY BALANCE",foodlog:"FOOD LOG",insights:"INSIGHTS",
   cal:"Calories",prot:"Protein",carb:"Carbs",fat:"Fat",total:"Total",deficit:"deficit",surplus:"surplus",over:"over",target:"target",
   burn:"Burn (TDEE)",intake:"Intake",item:"Item",foot:"Intake logged live · macro targets per plan",
   sDay:"Day",sBase:"Base",sEx:"Exercise",sDeficit:"Deficit (+ = surplus)",avg:"average",
   weekly:"WEEKLY",wWeek:"Week",wDays:"Days",wDeficitHdr:"Deficit",wWeightDelta:"Weight Δ",wAvgDay:"avg/day",
   wActual:"actual",wFullWeek:"full week",wMacros:"WEEKLY MACROS",wSpanNote:"Spans {n} days — more than one week between weigh-ins",
   wDaysUnit:"d",wNoWeek:"No week data yet."},
 hr:{title:"PATRIKOV UNOS",macros:"MAKROI VS CILJ",fill:"ISPUNJENOST",energy:"ENERGETSKA BILANCA",foodlog:"DNEVNIK PREHRANE",insights:"UVIDI",
   cal:"Kalorije",prot:"Proteini",carb:"UH",fat:"Masti",total:"Ukupno",deficit:"deficit",surplus:"višak",over:"iznad",target:"cilj",
   burn:"Potrošnja (TDEE)",intake:"Unos",item:"Stavka",foot:"Unos uživo · ciljevi makroa po planu",
   sDay:"Dan",sBase:"Baza",sEx:"Trening",sDeficit:"Deficit (+ = višak)",avg:"prosjek",
   weekly:"TJEDNO",wWeek:"Tjedan",wDays:"Dana",wDeficitHdr:"Deficit",wWeightDelta:"Promjena težine",wAvgDay:"prosj./dan",
   wActual:"stvarno",wFullWeek:"cijeli tjedan",wMacros:"TJEDNI MAKROI",wSpanNote:"Obuhvaća {n} dana — više od jednog tjedna između vaganja",
   wDaysUnit:"d",wNoWeek:"Još nema tjednih podataka."}
};
let LBL=T.en;
const pct=(v,m)=>Math.min(100,Math.round(v/(m||1)*100));
const bar=(lbl,val,max,unit)=>{const over=val>max;const w=pct(val,max);
  return `<div class="brow"><div class="bl"><span>${lbl}</span><b style="color:${over?'#BA7517':'var(--tp)'}">${val}${unit} / ${max}${unit} · ${w}%${over?' · '+LBL.over:''}</b></div>
   <div class="track"><div class="fill" style="width:${w}%;background:${over?'#BA7517':'#1D9E75'}"></div></div></div>`;};
const proteinBar=(lbl,val,max,unit)=>{const met=val>=max;const w=pct(val,max);
  return `<div class="brow"><div class="bl"><span>${lbl}</span><b style="color:${met?'#1D9E75':'var(--tp)'}">${val}${unit} / ${max}${unit} · ${w}%${met?' ✓':''}</b></div>
   <div class="track"><div class="fill" style="width:${w}%;background:${met?'#1D9E75':'#54718D'}"></div></div></div>`;};

function render(){
 if(!DATA||!DAYS.length){return;}
 const k=DAYS[daySel],tgt=k.target;
 const tot=k.total||k.log.reduce((a,f)=>({kcal:a.kcal+(+f.kcal||0),p:a.p+(+f.p||0),c:a.c+(+f.c||0),f:a.f+(+f.f||0)}),{kcal:0,p:0,c:0,f:0});
 const bal=k.tdee-tot.kcal;
 const wKg=DATA.athlete&&DATA.athlete.weightKg;
 document.getElementById('sub').textContent=k.date+" · "+k.dayType+(wKg?" · "+wKg+" kg":"");
 const card=(lab,val,sub,col)=>`<div class="card"><div class="lab">${lab}</div><div style="font-size:24px;font-weight:500;${col?'color:'+col:''}">${val}</div><div class="sub">${sub}</div></div>`;
 const intakeW=Math.round(tot.kcal/k.tdee*100);
 const pMet=tot.p>=tgt.p, pGap=tgt.p-tot.p;
 const insColor=pMet?'#1D9E75':'#BA7517';
 const insHeadEn=pMet?('Protein '+tot.p+'g — on target'):('Protein '+tot.p+'g — '+pGap+'g under target');
 const insHeadHr=pMet?('Proteini '+tot.p+'g — na cilju'):('Proteini '+tot.p+'g — '+pGap+'g ispod cilja');
 const balEn=bal>=0?(bal+' kcal deficit'):(Math.abs(bal)+' kcal surplus');
 const balHr=bal>=0?(bal+' kcal deficit'):(Math.abs(bal)+' kcal višak');
 const insBodyEn='Net balance is a '+balEn+' vs a ~'+k.tdee.toLocaleString()+' TDEE on a '+k.dayType+'. '+(pMet?('Protein hit the '+tgt.p+'g target. '):('Protein landed '+pGap+'g short of the '+tgt.p+'g target — worth topping up on a training day. '))+'Carbs '+tot.c+'g · fat '+tot.f+'g.';
 const insBodyHr='Neto bilanca je '+balHr+' uz ~'+k.tdee.toLocaleString()+' TDEE, dan: '+k.dayType+'. '+(pMet?('Proteini su dosegli cilj od '+tgt.p+'g. '):('Proteini su '+pGap+'g ispod cilja od '+tgt.p+'g — vrijedi nadopuniti na dan treninga. '))+'UH '+tot.c+'g · masti '+tot.f+'g.';
 const html=`
  <div class="h">${LBL.macros}</div>
  <div class="cards">
   ${card(LBL.cal,tot.kcal.toLocaleString(),'/ '+tgt.kcal.toLocaleString()+' '+LBL.target,'')}
   ${card(LBL.prot,tot.p+'g','/ '+tgt.p+'g'+(tot.p>=tgt.p?' ✓':''),'#1D9E75')}
   ${card(LBL.carb,tot.c+'g','/ '+tgt.c+'g','')}
   ${card(LBL.fat,tot.f+'g','/ '+tgt.f+'g','')}
  </div>
  <div class="h">${LBL.fill}</div>
  <div class="bars">
   ${bar(LBL.cal,tot.kcal,tgt.kcal,'')}
   ${bar(LBL.prot,tot.p,tgt.p,'g')}
   ${bar(LBL.carb,tot.c,tgt.c,'g')}
   ${bar(LBL.fat,tot.f,tgt.f,'g')}
  </div>
  <div class="h">${LBL.energy}</div>
  <div style="margin:0 0 1.5rem;">
   <div class="bl" style="display:flex;justify-content:space-between;font-size:13px;color:var(--ts);margin-bottom:5px;"><span>${LBL.burn}</span><b style="color:var(--tp)">~${k.tdee.toLocaleString()}</b></div>
   <div class="track" style="height:13px;margin-bottom:12px;"><div class="fill" style="width:100%;background:#54718D"></div></div>
   ${k.tdeeNote?`<div class="sub" style="margin:-6px 0 10px;font-size:11px;font-style:italic;" title="${k.tdeeNote}">${k.tdeeNote}</div>`:''}
   <div class="bl" style="display:flex;justify-content:space-between;font-size:13px;color:var(--ts);margin-bottom:5px;"><span>${LBL.intake}</span><b style="color:${bal>=0?'#1D9E75':'#BA7517'}">${tot.kcal.toLocaleString()} · ${bal>=0?LBL.deficit+' −'+bal:LBL.surplus+' +'+Math.abs(bal)}</b></div>
   <div class="track" style="height:13px;"><div class="fill" style="width:${intakeW}%;background:#2caaf0"></div></div>
  </div>
  <div class="h">${LBL.foodlog}</div>
  <table>
   <thead><tr><th>${LBL.item}</th><th>kcal</th><th>P</th><th>C</th><th>F</th></tr></thead>
   <tbody>${k.log.map(f=>`<tr><td>${f.name}</td><td>${f.kcal}</td><td>${f.p}</td><td>${f.c}</td><td>${f.f}</td></tr>`).join('')}</tbody>
   <tfoot><tr><td>${LBL.total}</td><td>${tot.kcal}</td><td>${tot.p}</td><td>${tot.c}</td><td>${tot.f}</td></tr></tfoot>
  </table>
  <div class="h">${LBL.insights}</div>
  <div class="note">
   <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${insColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
    <span style="font-weight:500;font-size:15px;">${lang==='en'?insHeadEn:insHeadHr}</span>
   </div>
   <p class="lab" style="margin:0;line-height:1.6;">${lang==='en'?insBodyEn:insBodyHr}</p>
  </div>`;
 document.getElementById('content').innerHTML=html;
}

function applyTheme(t){theme=t;document.getElementById('wrap').classList.toggle('dark',t==='dark');
 document.body.style.background=t==='dark'?'#262624':'#ffffff';markBtns();}
function setLang(l){lang=l;LBL=T[l];
 document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(LBL[k]!==undefined)el.textContent=LBL[k];});
 render();renderSummary();renderWeekly();markBtns();}
function toggleFont(){fontbig=!fontbig;document.getElementById('wrap').classList.toggle('big',fontbig);markBtns();}
function applyResponsive(){const want=window.innerWidth<560?'mobile':'desktop';if(layout===want)return;layout=want;
 document.getElementById('wrap').classList.toggle('mobile',want==='mobile');}
function markBtns(){
 const D=theme==='dark';
 const actBg=D?'#e8e8e6':'#444441',actFg=D?'#262624':'#ffffff';
 const inFg=D?'#e8e8e6':'#2c2c2a';
 const bd=D?'1px solid rgba(255,255,255,0.35)':'1px solid rgba(0,0,0,0.4)';
 const style=(b,on)=>{if(!b)return;b.style.background=on?actBg:'transparent';b.style.color=on?actFg:inFg;b.style.border=bd;b.style.borderRadius='8px';b.style.padding='4px 10px';b.style.fontSize='12px';b.style.fontWeight='500';b.style.cursor='pointer';};
 const states={'btn-en':lang==='en','btn-hr':lang==='hr','btn-fs':fontbig};
 Object.entries(states).forEach(([id,on])=>style(document.getElementById(id),on));
 document.querySelectorAll('.daybtn').forEach(b=>style(b,+b.getAttribute('data-idx')===daySel));
}
function selectDay(i){daySel=i;render();renderSummary();renderWeekly();markBtns();}
function renderDayBtns(){
 const el=document.getElementById('daybtns');
 if(!el)return;
 el.innerHTML=DAYS.map((d,i)=>`<button class="daybtn" data-idx="${i}" onclick="selectDay(${i})">${shortLabel(d.date)}</button>`).join('');
 markBtns();
}
function renderSummary(){
 const el=document.getElementById('daysum');
 if(!el||!DAYS.length)return;
 const base=(DATA.athlete&&DATA.athlete.restTdee)||0;
 const rows=DAYS.map(d=>{
  const intake=d.log.reduce((a,f)=>a+(+f.kcal||0),0);
  const tdee=d.tdee;
  const ex=Math.max(0,tdee-base);
  const deficit=tdee-intake;
  return{intake,base,ex,tdee,deficit};
 });
 const n=rows.length;
 const avg=k=>Math.round(rows.reduce((a,r)=>a+r[k],0)/n);
 const avgRow={intake:avg('intake'),base:avg('base'),ex:avg('ex'),tdee:avg('tdee'),deficit:avg('deficit')};
 const fmt=v=>v.toLocaleString();
 const defCell=v=>{const col=v>=0?'#1D9E75':(theme==='dark'?'#E24B4A':'#A32D2D');const txt=v>=0?fmt(v):'+'+fmt(Math.abs(v));
  return `<td style="color:${col};font-weight:500;">${txt}</td>`;};
 const trs=DAYS.map((d,i)=>{
  const r=rows[i],sel=i===daySel;
  return `<tr onclick="selectDay(${i})" style="cursor:pointer;${sel?'font-weight:600;':''}">
   <td style="${sel?'color:var(--tp);':''}">${sel?'▸ ':''}${shortLabel(d.date)}</td>
   <td>${fmt(r.intake)}</td><td>${fmt(r.base)}</td><td>${fmt(r.ex)}</td><td>${fmt(r.tdee)}</td>${defCell(r.deficit)}
  </tr>`;
 }).join('');
 el.innerHTML=`<div style="overflow-x:auto;"><table style="margin:0;">
  <thead><tr><th>${LBL.sDay}</th><th>${LBL.intake}</th><th>${LBL.sBase}</th><th>${LBL.sEx}</th><th>TDEE</th><th>${LBL.sDeficit}</th></tr></thead>
  <tbody>${trs}</tbody>
  <tfoot><tr><td>${LBL.avg}</td><td>${fmt(avgRow.intake)}</td><td>${fmt(avgRow.base)}</td><td>${fmt(avgRow.ex)}</td><td>${fmt(avgRow.tdee)}</td>${defCell(avgRow.deficit)}</tr></tfoot>
 </table></div>`;
}

/* ---- weekly aggregation (Mon–Sun), derived at render time ---- */
const MONTHS={en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
 hr:['sij','velj','ožu','tra','svi','lip','srp','kol','ruj','lis','stu','pro']};
function parseISODate(dstr){const iso=dstr.split(' ')[1];const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function parseISODateStr(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function isoStr(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function mondayOf(dt){const day=dt.getDay();const diff=(day===0?-6:1-day);return new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+diff);}
function weekLabel(mon,sun){const mo=MONTHS[lang]||MONTHS.en;const sameYear=mon.getFullYear()===sun.getFullYear();
 const a=mon.getDate()+' '+mo[mon.getMonth()];const b=sun.getDate()+' '+mo[sun.getMonth()]+(sameYear?'':' '+sun.getFullYear());
 return a+' – '+b;}
function dayMetrics(d,base){
 const tot=d.total||d.log.reduce((a,f)=>({kcal:a.kcal+(+f.kcal||0),p:a.p+(+f.p||0),c:a.c+(+f.c||0),f:a.f+(+f.f||0)}),{kcal:0,p:0,c:0,f:0});
 const intake=tot.kcal; /* same source as the day view, so the two can never disagree */
 const tdee=d.tdee,ex=Math.max(0,tdee-base),deficit=tdee-intake;
 return{intake,base,ex,tdee,deficit,tot};
}
function computeWeeks(){
 const map=new Map();
 (DATA.days||[]).forEach(d=>{
  const mon=mondayOf(parseISODate(d.date));
  const key=isoStr(mon);
  if(!map.has(key))map.set(key,{monKey:key,mon,sun:new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6),days:[]});
  map.get(key).days.push(d);
 });
 return Array.from(map.values()).sort((a,b)=>a.monKey<b.monKey?-1:a.monKey>b.monKey?1:0);
}
function weekAggregate(w){
 const base=(DATA.athlete&&DATA.athlete.restTdee)||0;
 const metrics=w.days.map(d=>dayMetrics(d,base));
 const n=metrics.length;
 const sum=k=>metrics.reduce((a,m)=>a+m[k],0);
 const intake=sum('intake'),baseSum=base*n,ex=sum('ex'),tdee=sum('tdee'),deficit=sum('deficit');
 const avgIntake=n?Math.round(intake/n):0,avgDeficit=n?Math.round(deficit/n):0;
 const actual=metrics.reduce((a,m)=>({kcal:a.kcal+m.tot.kcal,p:a.p+m.tot.p,c:a.c+m.tot.c,f:a.f+m.tot.f}),{kcal:0,p:0,c:0,f:0});
 const target=w.days.reduce((a,d)=>{const t=d.target||{};return{kcal:a.kcal+(+t.kcal||0),p:a.p+(+t.p||0),c:a.c+(+t.c||0),f:a.f+(+t.f||0)};},{kcal:0,p:0,c:0,f:0});
 const freq=new Map();
 w.days.forEach(d=>{const key=JSON.stringify(d.target||{});freq.set(key,(freq.get(key)||0)+1);});
 let modeTarget=null,modeCount=-1;
 w.days.forEach(d=>{const key=JSON.stringify(d.target||{});const c=freq.get(key);if(c>modeCount){modeCount=c;modeTarget=d.target||{};}});
 const fullWeekTarget=modeTarget?{kcal:(+modeTarget.kcal||0)*7,p:(+modeTarget.p||0)*7,c:(+modeTarget.c||0)*7,f:(+modeTarget.f||0)*7}:{kcal:0,p:0,c:0,f:0};
 return{n,intake,base:baseSum,ex,tdee,deficit,avgIntake,avgDeficit,actual,target,fullWeekTarget};
}
function weekWeightDelta(w){
 const entries=(WEIGHT&&WEIGHT.weeks)||[];
 if(!entries.length)return null;
 const monStr=isoStr(w.mon),sunStr=isoStr(w.sun);
 let curr=null;
 entries.forEach(e=>{if(e.d>=monStr&&e.d<=sunStr){if(!curr||e.d>curr.d)curr=e;}});
 if(!curr)return null;
 let prev=null;
 entries.forEach(e=>{if(e.d<monStr){if(!prev||e.d>prev.d)prev=e;}});
 if(!prev)return null;
 const delta=Math.round((curr.w-prev.w)*10)/10;
 const spanDays=Math.round((parseISODateStr(curr.d)-parseISODateStr(prev.d))/86400000);
 return{delta,spanDays,curr,prev};
}
function renderWeekMacros(weeks){
 if(!weeks.length)return '';
 const selDay=DAYS[daySel];
 const monKey=isoStr(mondayOf(parseISODate(selDay.date)));
 const w=weeks.find(x=>x.monKey===monKey)||weeks[weeks.length-1];
 const agg=weekAggregate(w);
 const label=weekLabel(w.mon,w.sun);
 const mk=(lbl,unit,a,t,ft,goodOver)=>{
  const delta=a-t;
  const hit=goodOver?a>=t:a<=t;
  const col=hit?(goodOver?'#1D9E75':'var(--tp)'):'#BA7517';
  const sign=delta>0?'+':(delta<0?'−':'');
  const dtxt=delta===0?'0':sign+Math.abs(delta).toLocaleString();
  return `<div class="card">
   <div class="lab">${lbl}</div>
   <div style="font-size:18px;font-weight:500;">${a.toLocaleString()}${unit} <span class="sub">${LBL.wActual}</span></div>
   <div class="sub">/ ${t.toLocaleString()}${unit} ${LBL.target} · Δ <span style="color:${col};font-weight:500;">${dtxt}${unit}</span></div>
   <div class="sub" style="opacity:.65;margin-top:2px;">${ft.toLocaleString()}${unit} ${LBL.target} · ${LBL.wFullWeek}</div>
  </div>`;
 };
 return `<div class="h">${LBL.wMacros} — ${label}</div>
 <div class="cards">
  ${mk(LBL.cal,'',agg.actual.kcal,agg.target.kcal,agg.fullWeekTarget.kcal,false)}
  ${mk(LBL.prot,'g',agg.actual.p,agg.target.p,agg.fullWeekTarget.p,true)}
  ${mk(LBL.carb,'g',agg.actual.c,agg.target.c,agg.fullWeekTarget.c,false)}
  ${mk(LBL.fat,'g',agg.actual.f,agg.target.f,agg.fullWeekTarget.f,false)}
 </div>
 <div class="bars">
  ${bar(LBL.cal,agg.actual.kcal,agg.target.kcal,'')}
  ${proteinBar(LBL.prot,agg.actual.p,agg.target.p,'g')}
  ${bar(LBL.carb,agg.actual.c,agg.target.c,'g')}
  ${bar(LBL.fat,agg.actual.f,agg.target.f,'g')}
 </div>`;
}
function renderWeekly(){
 const el=document.getElementById('weeksum');
 if(!el||!DATA||!DAYS.length)return;
 const weeks=computeWeeks();
 if(!weeks.length){el.innerHTML='';return;}
 const fmt=v=>v.toLocaleString();
 const defCell=(v,avg)=>{const col=v>=0?'#1D9E75':(theme==='dark'?'#E24B4A':'#A32D2D');const txt=v>=0?fmt(v):'+'+fmt(Math.abs(v));
  return `<td style="color:${col};font-weight:500;">${txt}<div class="sub" style="font-size:10px;font-weight:400;">${fmt(avg)} ${LBL.wAvgDay}</div></td>`;};
 const rows=weeks.map(w=>{
  const agg=weekAggregate(w);
  const wd=weekWeightDelta(w);
  let wdHtml='—';
  if(wd){
   const sign=wd.delta<0?'−':(wd.delta>0?'+':'');
   const txt=sign+Math.abs(wd.delta).toFixed(1)+' kg';
   if(wd.spanDays>10){
    const note=LBL.wSpanNote.replace('{n}',wd.spanDays);
    wdHtml=`<span style="font-style:italic;color:var(--ts);" title="${note}">${txt} (${wd.spanDays} ${LBL.wDaysUnit})</span>`;
   }else{
    const col=wd.delta<0?'#1D9E75':(theme==='dark'?'#E24B4A':'#A32D2D');
    wdHtml=`<span style="color:${col};font-weight:500;">${txt}</span>`;
   }
  }
  const label=weekLabel(w.mon,w.sun);
  return `<tr>
   <td>${label}</td>
   <td>${agg.n}/7</td>
   <td>${fmt(agg.intake)}<div class="sub" style="font-size:10px;">${fmt(agg.avgIntake)} ${LBL.wAvgDay}</div></td>
   <td>${fmt(agg.base)}</td>
   <td>${fmt(agg.ex)}</td>
   <td>${fmt(agg.tdee)}</td>
   ${defCell(agg.deficit,agg.avgDeficit)}
   <td>${wdHtml}</td>
  </tr>`;
 }).join('');
 el.innerHTML=`<div class="h">${LBL.weekly}</div>
  <div style="overflow-x:auto;"><table style="margin:0 0 1.25rem;">
   <thead><tr><th>${LBL.wWeek}</th><th>${LBL.wDays}</th><th>${LBL.intake}</th><th>${LBL.sBase}</th><th>${LBL.sEx}</th><th>TDEE</th><th>${LBL.wDeficitHdr}</th><th>${LBL.wWeightDelta}</th></tr></thead>
   <tbody>${rows}</tbody>
  </table></div>
  ${renderWeekMacros(weeks)}`;
}
applyTheme(theme);applyResponsive();markBtns();
window.addEventListener('resize',applyResponsive);

let WEIGHT=null;
fetch('data.json',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
 .then(j=>{DATA=j;DAYS=DATA.days||(DATA.intake?[DATA.intake]:[]);daySel=DAYS.length-1;renderDayBtns();renderSummary();render();renderWeekly();})
 .catch(err=>{document.getElementById('content').innerHTML=
   `<div class="state">Couldn't load data.json (${err.message}).<br><br>If you opened this file directly, serve it over http (it works on GitHub Pages).</div>`;});

fetch('weight-data.json',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
 .then(j=>{WEIGHT=j;if(DATA)renderWeekly();})
 .catch(()=>{WEIGHT=null;if(DATA)renderWeekly();});
</script>
</body>
</html>
