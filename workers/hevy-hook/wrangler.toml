name = "hevy-hook"
main = "src/index.js"
compatibility_date = "2026-09-29"
workers_dev = true

# Live Hevy webhook receiver (see README.md). Separate from the static site
# Worker in the repo root; the site deploy ignores workers/ via .assetsignore.

routes = [{ pattern = "hevy.er45.com", custom_domain = true }]

[[kv_namespaces]]
binding = "LIVE"
id = "9d6384fc162e47879e7530297ecebc5c"   # title "LIVE", created 2026-09-29

[vars]
# Cloudflare Access application AUD tag for /admin/* (Zero Trust -> Access -> Applications ->
# <app> -> Overview -> Application Audience (AUD) Tag). Empty = every /admin/* answers 503
# "admin not configured" (never open). Not a secret.
ACCESS_AUD = "60a97e3233834776bb1afb42fcef941b3e7324be2cec864c779ec07eea208111"
# Daily Claude API spend cap in USD (Europe/Zagreb day). At or above it, calls are skipped and logged.
MAX_USD_PER_DAY = "1.00"

[triggers]
# */10: pending retries, hourly events poll, queued webhook narrative (mode "api").
# 40 5 * * * and 40 6 * * *: daily coach narrative (mode "api") at 07:40 Europe/Zagreb all year.
# Cron is UTC and has no time zones: 05:40 UTC = 07:40 in summer time (CEST, UTC+2) and 06:40 UTC
# = 07:40 in winter time (CET, UTC+1). Both fire every day; the handler runs the narrative only
# when the Zagreb local hour is 7, so the other trigger is a no-op.
# Keep in sync with DAILY_CRONS in src/narrative.js.
crons = ["*/10 * * * *", "40 5 * * *", "40 6 * * *"]

[observability]
enabled = true
